<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cara robot</title>
    <style>
        :root {
            --bg-dark: #111111;
            --bg-light: #2a2a2a;
            --blue-light: #4db8ff;
            --blue-dark: #2980b9;
            --eye-white: #ffffff;
            --iris-center: #8d6e63;
            --iris-edge: #3e2723;
            --pupil: #000000;
            --lid: #171717;
        }

        html, body { height: 100%; }

        body {
            background: radial-gradient(circle at center bottom, var(--bg-light), var(--bg-dark));
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            cursor: none;
        }
        body.debug { cursor: default; }

        /* El escenario se escala solo para encajar en cualquier pantalla */
        #stage { transform-origin: center center; }

        .face-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- CEJAS --- */
        .brows-row { display: flex; margin-bottom: -25px; z-index: 10; }
        .brow.right { margin-left: 70px; }

        .brow {
            width: 80px; height: 18px;
            background: linear-gradient(to bottom, var(--blue-light), var(--blue-dark));
            border-radius: 20px;
            box-shadow: 0 2px 10px rgba(52, 152, 219, 0.4);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .brow.left { transform: rotate(-12deg); }
        .brow.right { transform: rotate(12deg); }

        /* --- OJOS --- */
        .eyes-row { display: flex; margin-top: 15px; }
        .eyes-row .eye-white + .eye-white { margin-left: 35px; }

        .eye-white {
            width: 150px; height: 150px;
            background-color: var(--eye-white);
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 15px 20px -5px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 1;
            transition: all 0.4s ease;
        }

        .eye-white::after {
            content: ''; position: absolute;
            top: 20px; right: 35px;
            width: 35px; height: 25px;
            background: white;
            border-radius: 50%;
            transform: rotate(-20deg);
            filter: blur(1px);
            z-index: 20; pointer-events: none;
        }
        .eye-white::before {
            content: ''; position: absolute;
            top: 65px; right: 60px;
            width: 12px; height: 12px;
            background: white;
            border-radius: 50%;
            filter: blur(0.5px);
            z-index: 20; pointer-events: none;
        }

        /* Párpado para parpadear (cubre también los brillos) */
        .lid {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--lid);
            transform: translateY(-104%);
            transition: transform 70ms ease-in;
            z-index: 30; pointer-events: none;
        }
        #stage.blinking .lid { transform: translateY(0); }

        .iris-group {
            width: 90px; height: 90px;
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s, transform 0.18s ease-out;
            display: flex; justify-content: center; align-items: center;
        }

        .iris {
            width: 100%; height: 100%;
            background: radial-gradient(circle, var(--iris-center) 30%, var(--iris-edge) 100%);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        .pupil {
            width: 45%; height: 45%;
            background-color: var(--pupil);
            border-radius: 50%;
        }

        /* --- BOCA --- */
        /* El contenedor recibe la animación de hablar; la boca interior, la forma de la emoción */
        .mouth-wrap { margin-top: 15px; transform-origin: 50% 0; }

        .mouth {
            width: 90px;
            height: 45px;
            background: linear-gradient(to bottom, var(--blue-light), var(--blue-dark));
            border-radius: 10px 10px 50px 50px;
            margin-top: 5px;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* ================================
           ESTADOS EMOCIONALES
           ================================ */

        /* FELIZ */
        .face-container.happy .brow.left { transform: translateY(-5px) rotate(-15deg); }
        .face-container.happy .brow.right { transform: translateY(-5px) rotate(15deg); }
        .face-container.happy .mouth {
            height: 55px; width: 110px; border-radius: 10px 10px 60px 60px;
        }

        /* TRISTE */
        .face-container.sad .brow.left { transform: rotate(20deg) translateY(5px); }
        .face-container.sad .brow.right { transform: rotate(-20deg) translateY(5px); }
        .face-container.sad .eye-white { height: 130px; border-radius: 40% 40% 50% 50%; }
        .face-container.sad .mouth {
            height: 40px; width: 100px;
            border-radius: 50px 50px 10px 10px;
            transform: translateY(15px);
        }

        /* ENFADO */
        .face-container.angry .brow.left { transform: translateY(20px) rotate(30deg); }
        .face-container.angry .brow.right { transform: translateY(20px) rotate(-30deg); }
        .face-container.angry .eye-white { border-radius: 20% 20% 50% 50%; height: 135px; }
        .face-container.angry .iris-group { width: 60px; height: 60px; }
        .face-container.angry .mouth {
            width: 70px; height: 12px; border-radius: 10px;
            transform: translateY(-5px);
        }

        /* SORPRESA */
        .face-container.surprised .brow.left { transform: translateY(-40px) rotate(-10deg); }
        .face-container.surprised .brow.right { transform: translateY(-40px) rotate(10deg); }
        .face-container.surprised .eye-white { transform: scale(1.05); }
        .face-container.surprised .iris-group { width: 75px; height: 75px; }
        .face-container.surprised .mouth {
            width: 50px; height: 60px; border-radius: 50%;
        }

        /* PENSATIVO (una ceja arriba, boca pequeña ladeada) */
        .face-container.thinking .brow.left { transform: translateY(-16px) rotate(-18deg); }
        .face-container.thinking .brow.right { transform: translateY(4px) rotate(8deg); }
        .face-container.thinking .mouth {
            width: 52px; height: 14px; border-radius: 10px;
            transform: translateX(16px) rotate(-6deg);
        }

        /* ESCUCHANDO (cejas atentas, pupilas algo más grandes) */
        .face-container.listening .brow.left { transform: translateY(-10px) rotate(-8deg); }
        .face-container.listening .brow.right { transform: translateY(-10px) rotate(8deg); }
        .face-container.listening .iris-group { width: 100px; height: 100px; }
        .face-container.listening .mouth {
            width: 60px; height: 26px; border-radius: 10px 10px 30px 30px;
        }

        /* CONTROLES (solo en modo prueba: añade ?debug a la dirección) */
        .hud {
            display: none;
            position: absolute; bottom: 20px; flex-wrap: wrap; justify-content: center;
            background: rgba(255,255,255,0.1); padding: 8px 14px; border-radius: 30px;
            max-width: 95%;
        }
        body.debug .hud { display: flex; }
        button {
            background: transparent; color: rgba(255,255,255,0.8); border: 1px solid rgba(255,255,255,0.3);
            padding: 7px 14px; margin: 3px; border-radius: 20px; cursor: pointer; font-weight: 600;
            transition: 0.2s; font-size: 14px;
        }
        button:hover { background: var(--blue-light); color: #000; border-color: var(--blue-light); }
    </style>
</head>
<body>

    <div id="stage">
        <div class="face-container" id="robotFace">
            <div class="brows-row">
                <div class="brow left"></div>
                <div class="brow right"></div>
            </div>

            <div class="eyes-row">
                <div class="eye-white">
                    <div class="iris-group"><div class="iris"><div class="pupil"></div></div></div>
                    <div class="lid"></div>
                </div>
                <div class="eye-white">
                    <div class="iris-group"><div class="iris"><div class="pupil"></div></div></div>
                    <div class="lid"></div>
                </div>
            </div>

            <div class="mouth-wrap" id="mouthWrap">
                <div class="mouth"></div>
            </div>
        </div>
    </div>

    <div class="hud">
        <button onclick="Cara.emotion('neutral')">Neutro</button>
        <button onclick="Cara.emotion('alegre')">Feliz</button>
        <button onclick="Cara.emotion('triste')">Triste</button>
        <button onclick="Cara.emotion('enfadado')">Enojo</button>
        <button onclick="Cara.emotion('sorprendido')">Sorpresa</button>
        <button onclick="Cara.emotion('pensativo')">Pensativo</button>
        <button onclick="Cara.listen()">Escuchando</button>
        <button onclick="Cara.test()">Hablar</button>
    </div>

    <!-- SDK de Alexa HTML. Si no carga (por ejemplo, sin internet), la página entra en modo prueba. -->
    <script src="https://cdn.html.games.alexa.a2z.com/alexa-html/latest/alexa-html.js"></script>
    <script>
    (function () {
        'use strict';

        var stage = document.getElementById('stage');
        var face = document.getElementById('robotFace');
        var mouthWrap = document.getElementById('mouthWrap');
        var irisGroups = document.querySelectorAll('.iris-group');

        // ---------- Configuración ----------
        var SYLLABLE_MS = 200;      // duración media de una sílaba al hablar Alexa
        var WAIT_MS = 8000;         // cuánto tiempo se queda "pensando" esperando respuesta
        var START_FALLBACK_MS = 2500; // si Alexa no avisa de que empieza a hablar, arrancamos igualmente

        var CSS_CLASS = {
            neutral: '', neutro: '',
            happy: 'happy', alegre: 'happy', feliz: 'happy',
            sad: 'sad', triste: 'sad',
            angry: 'angry', enfadado: 'angry', enojo: 'angry',
            surprised: 'surprised', sorprendido: 'surprised', sorpresa: 'surprised',
            thinking: 'thinking', pensativo: 'thinking'
        };
        // Cuánto se abre la boca al hablar según la emoción (las bocas pequeñas necesitan más)
        var MOUTH_GAIN = { '': 0.9, happy: 0.9, sad: 1.0, angry: 2.2, surprised: 0.45, thinking: 2.4, listening: 1.0 };

        // ---------- Estado ----------
        var DEBUG = /[?&]debug/.test(location.search);
        var base = '';          // emoción de fondo
        var listening = false;  // micrófono abierto
        var waiting = false;    // esperando la respuesta
        var talking = false;    // Alexa hablando
        var gain = MOUTH_GAIN[''];
        var waitTimer = null, startTimer = null, stopTimer = null;

        function render() {
            var key = base;
            if (!talking) {
                if (listening) key = 'listening';
                else if (waiting) key = 'thinking';
            }
            face.className = 'face-container' + (key ? ' ' + key : '');
            gain = MOUTH_GAIN[key] !== undefined ? MOUTH_GAIN[key] : 0.9;
        }

        function setEmotion(name) {
            var cls = CSS_CLASS[String(name || 'neutral').toLowerCase()];
            base = cls === undefined ? '' : cls;
            render();
        }

        // ---------- Escalado a la pantalla ----------
        function fit() {
            var s = Math.min(window.innerWidth / 460, window.innerHeight / 380) * 0.95;
            stage.style.transform = 'scale(' + s + ')';
        }
        window.addEventListener('resize', fit);
        fit();

        // ---------- Mirada ----------
        function setGaze(x, y) {
            for (var i = 0; i < irisGroups.length; i++) {
                irisGroups[i].style.transform = 'translate(-50%, -50%) translate(' + x + 'px, ' + y + 'px)';
            }
        }
        function gazeLoop() {
            if (!DEBUG || !gazeLoop.mouse) {
                if (!talking && waiting && !listening) setGaze(-22, -30);       // pensando: mira arriba
                else if (listening) setGaze(0, 0);                               // escuchando: mira al frente
                else if (Math.random() < 0.3) setGaze(0, 0);
                else setGaze(Math.round((Math.random() - 0.5) * 44), Math.round((Math.random() - 0.5) * 24));
            }
            setTimeout(gazeLoop, 1800 + Math.random() * 2800);
        }
        gazeLoop();

        document.addEventListener('mousemove', function (e) {
            if (!DEBUG) return;
            gazeLoop.mouse = true;
            var limit = 38;
            var mx = Math.min(Math.max((e.clientX - window.innerWidth / 2) / 10, -limit), limit);
            var my = Math.min(Math.max((e.clientY - window.innerHeight / 2) / 10, -limit), limit);
            setGaze(mx, my);
        });

        // ---------- Parpadeo ----------
        function blink() {
            stage.classList.add('blinking');
            setTimeout(function () { stage.classList.remove('blinking'); }, 130);
        }
        function blinkLoop() {
            blink();
            if (Math.random() < 0.15) setTimeout(blink, 260);
            setTimeout(blinkLoop, 2800 + Math.random() * 3200);
        }
        setTimeout(blinkLoop, 1500);

        // ---------- Boca al hablar ----------
        // Se genera un ritmo de sílabas a partir del texto y se sincroniza con los avisos de Alexa.
        var VOWEL_AMP = { a: 1, o: 0.85, e: 0.7, u: 0.55, i: 0.4 };
        var VOWEL_BASE = { 'á': 'a', 'é': 'e', 'í': 'i', 'ó': 'o', 'ú': 'u', 'ü': 'u' };

        function buildSegments(text) {
            var segs = [];
            var words = String(text || '').replace(/\s+/g, ' ').trim().split(' ');
            for (var w = 0; w < words.length; w++) {
                var word = words[w];
                if (!word) continue;
                var groups = word.toLowerCase().match(/[aeiouáéíóúü]+/g) || ['a'];
                for (var g = 0; g < groups.length; g++) {
                    var ch = groups[g].charAt(0);
                    ch = VOWEL_BASE[ch] || ch;
                    var amp = (VOWEL_AMP[ch] || 0.6) * (0.85 + Math.random() * 0.3);
                    segs.push({ dur: SYLLABLE_MS * (0.85 + Math.random() * 0.3), amp: Math.min(1, amp) });
                }
                var last = word.charAt(word.length - 1);
                if (/[,;:]/.test(last)) segs.push({ dur: 220, amp: 0 });
                else if (/[.!?…]/.test(last)) segs.push({ dur: 380, amp: 0 });
                else segs.push({ dur: 50, amp: 0 });
            }
            return segs;
        }

        var talk = { on: false, queue: [], seg: null, segStart: 0 };
        var randomCount = 0;
        var openNow = 0;

        function randomSeg() {
            randomCount++;
            if (randomCount % 7 === 0) return { dur: 260, amp: 0 };
            return { dur: 140 + Math.random() * 100, amp: 0.35 + Math.random() * 0.65 };
        }
        function nextSeg() { return talk.queue.length ? talk.queue.shift() : randomSeg(); }

        function startTalk() {
            clearTimeout(startTimer);
            talking = true;
            waiting = false;
            clearTimeout(waitTimer);
            talk.on = true;
            talk.segStart = performance.now();
            talk.seg = nextSeg();
            render();
        }
        function stopTalk() {
            clearTimeout(startTimer);
            clearTimeout(stopTimer);
            talking = false;
            talk.on = false;
            talk.queue = [];
            render();
        }

        function speak(texto, emocion) {
            if (emocion) setEmotion(emocion);
            waiting = false;
            clearTimeout(waitTimer);
            var segs = buildSegments(texto);
            talk.queue = segs;
            if (talk.on) {                       // Alexa ya había empezado: reajustamos al texto
                talk.segStart = performance.now();
                talk.seg = nextSeg();
            } else {                             // por si Alexa no avisa de que empieza a hablar
                var total = 0;
                for (var i = 0; i < segs.length; i++) total += segs[i].dur;
                clearTimeout(startTimer);
                startTimer = setTimeout(function () {
                    startTalk();
                    clearTimeout(stopTimer);
                    stopTimer = setTimeout(stopTalk, total * 1.2 + 800);
                }, START_FALLBACK_MS);
            }
            render();
        }

        function frame() {
            var now = performance.now();
            var target = 0;
            if (talk.on && talk.seg) {
                var t = now - talk.segStart;
                var guard = 0;
                while (t >= talk.seg.dur && guard < 20) {
                    t -= talk.seg.dur;
                    talk.segStart += talk.seg.dur;
                    talk.seg = nextSeg();
                    guard++;
                }
                if (guard >= 20) talk.segStart = now;
                if (talk.seg.amp > 0) {
                    target = talk.seg.amp * Math.pow(Math.sin(Math.PI * Math.min(1, t / talk.seg.dur)), 0.8);
                }
            }
            openNow += (target - openNow) * 0.55;
            if (openNow < 0.002) openNow = 0;
            mouthWrap.style.transform = 'scale(' + (1 + 0.05 * openNow) + ',' + (1 + gain * openNow) + ')';
            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);

        // ---------- Mensajes de la skill ----------
        function onSkillMessage(m) {
            if (!m) return;
            if (m.type === 'speak') speak(m.texto, m.emocion);
            else if (m.type === 'emotion') setEmotion(m.emocion);
        }

        function micOpened() {
            listening = true;
            waiting = false;
            clearTimeout(waitTimer);
            render();
        }
        function micClosed() {
            listening = false;
            if (!talking) {
                waiting = true;                  // el usuario ha hablado: esperamos la respuesta
                clearTimeout(waitTimer);
                waitTimer = setTimeout(function () { waiting = false; render(); }, WAIT_MS);
            }
            render();
        }

        // ---------- Alexa ----------
        function enableDebug() {
            DEBUG = true;
            document.body.classList.add('debug');
        }

        function initAlexa() {
            if (DEBUG) document.body.classList.add('debug');
            if (typeof Alexa === 'undefined' || !Alexa.create) { enableDebug(); return; }
            Alexa.create({ version: '1.1' }).then(function (args) {
                var alexa = args.alexa;
                alexa.skill.onMessage(onSkillMessage);
                if (alexa.speech) {
                    alexa.speech.onStarted(startTalk);
                    alexa.speech.onStopped(stopTalk);
                }
                if (alexa.voice) {
                    alexa.voice.onMicrophoneOpened(micOpened);
                    alexa.voice.onMicrophoneClosed(micClosed);
                }
                var init = args.message;
                if (init) onSkillMessage(init.data || init.message || init);
            }).catch(function (err) {
                if (window.console) console.log('Alexa HTML no disponible:', err);
                enableDebug();
            });
        }

        // ---------- Utilidades para probar en el navegador (?debug) ----------
        window.Cara = {
            emotion: function (e) { setEmotion(e); },
            listen: function () { listening ? (listening = false, render()) : micOpened(); },
            test: function () {
                var texto = 'Hola, soy tu amigo curioso. Puedes preguntarme lo que quieras, y te contestaré encantado.';
                speak(texto, base || 'alegre');
                startTalk();
                var total = 0, segs = talk.queue.slice();
                for (var i = 0; i < segs.length; i++) total += segs[i].dur;
                clearTimeout(stopTimer);
                stopTimer = setTimeout(stopTalk, total + 300);
            },
            speak: speak, stop: stopTalk
        };

        render();
        initAlexa();
    })();
    </script>
</body>
</html>
